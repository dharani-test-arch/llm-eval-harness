name: eval

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # weekly live evaluation, Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to evaluate (blank = default)'
        required: false
        default: ''
      runs:
        description: 'Runs per case'
        required: false
        default: '5'

jobs:
  harness:
    name: harness tests + offline eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Validate the golden dataset
        run: npm run validate:data
      - name: Harness unit tests
        run: npm test
      # Needs no API key: proves the pipeline and gates work on every change.
      - name: Offline evaluation (mock model)
        run: npm run eval:mock
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: eval-report-mock
          path: results
          retention-days: 14

  live-eval:
    name: live model evaluation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_MODEL: ${{ inputs.model }}
    steps:
      - name: Check for API key
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANTHROPIC_API_KEY secret is not set; skipping the live evaluation."
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.key.outputs.present == 'true'
        run: npm ci
      - name: Evaluate
        if: steps.key.outputs.present == 'true'
        run: npm run eval:live -- --runs "${{ inputs.runs || '5' }}" --judge
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.key.outputs.present == 'true' }}
        with:
          name: eval-report-live
          path: results
          retention-days: 90
